name: backlog-guard
# BACKLOG.md is a generated index over backlog/tasks/*.md and is never edited
# by hand (ADR 007). The store tool itself is vendored
# into gitignored .ai-task/, so the check runs from the tracked
# scripts/backlog-index-guard.py - the store's own code bundled into one
# self-contained file. Generated: refresh it with `ai-task init`, never edit it.
on:
  push:
    branches: [main]
    paths:
      - 'BACKLOG.md'
      - 'backlog/**'
      - 'scripts/backlog-index-guard.py'
      - '.github/workflows/backlog-guard.yml'
  pull_request:
    paths:
      - 'BACKLOG.md'
      - 'backlog/**'
      - 'scripts/backlog-index-guard.py'
      - '.github/workflows/backlog-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
# Отмена только для PR. В PR пуши до последнего устарели по определению.
# В push в main отмена оставила бы коммит в истории непроверенным навсегда, и выглядело бы это
# как обычная отмена. Не заменять литералом true - форма канонична для всех репозиториев.
concurrency:
  group: backlog-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/backlog-index-guard.py check
