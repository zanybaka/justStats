name: CI

# Триггеры - канон CI: push в main +
# pull_request + workflow_dispatch. У pull_request фильтр по базовой ветке снят
# намеренно: волна метит PR в main, но PR в любую другую базу тоже должен ловить
# гейт, а не проходить молча. Раннер macOS платный x10, но репозиторий публичный -
# минуты Actions на публичных репо не тарифицируются.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Отмена только для PR. В PR пуши до последнего устарели по определению.
# В push в main отмена оставила бы коммит в истории непроверенным навсегда, и выглядело бы это
# как обычная отмена. Не заменять литералом true - форма канонична для всех репозиториев.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Xcode 26.x image. The pbxproj is Xcode-16+ format, so `macos-15`
    # (Xcode 16.x) also works as a fallback if macos-26 is unavailable.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: |
          # Prefer the newest Xcode 26.x installed on the runner.
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild \
            -project justStats.xcodeproj \
            -scheme justStats \
            -destination 'platform=macOS' \
            build test \
            CODE_SIGNING_ALLOWED=NO
